name: Build APKs
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle :userapp:assembleDebug :adminapp:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: teenpatti-apks
          path: |
            userapp/build/outputs/apk/debug/*.apk
            adminapp/build/outputs/apk/debug/*.apk
